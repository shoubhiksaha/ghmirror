[project]
name = "ghmirror"
version = "0.1.0"
description = "One-to-one GitHub organization mirror into self-managed GitLab instances"
requires-python = ">=3.10"
dependencies = ["requests>=2.28", "PyYAML>=6", "PyJWT[crypto]>=2.6"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
test = ["pytest>=7"]

[project.scripts]
ghmirror = "ghmirror.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ghmirror"]

[tool.setuptools.package-data]
ghmirror = ["*.rb", "*.sh"]
